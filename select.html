<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゲームを選ぶ｜AIゲーム実験室</title>
<meta name="description" content="AIだけで作ったスマホ広告風ゲーム。迎撃ロードと Million March から選んで遊べます。">
<meta name="theme-color" content="#241c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chango&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --ink:#241c18; --stone:#e4dbc6; --soft:rgba(228,219,198,.72);
    --gold:#e0a83c; --blue:#9cc0ff;
    --disp:"Chango","Arial Black",system-ui,sans-serif;
    --ui:"Barlow Semi Condensed","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; min-height:100dvh; font-family:var(--ui); color:var(--stone);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(36,28,24,.45), rgba(20,15,12,.92) 70%),
      url("assets/ancient-valley.webp") center/cover no-repeat fixed, var(--ink);
    display:flex; flex-direction:column;
  }
  main{flex:1; width:100%; max-width:760px; margin:0 auto;
       padding:max(28px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
       display:flex; flex-direction:column; justify-content:center}
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); text-align:center}
  h1{font-family:var(--disp); font-weight:400; color:var(--gold); text-align:center; line-height:1.05;
     font-size:clamp(30px,8vw,44px); margin:8px 0 22px; text-shadow:0 3px 0 rgba(0,0,0,.45)}
  .list{display:grid; gap:16px}
  @media (min-width:700px){ .list{grid-template-columns:repeat(3,1fr)} }

  a.game{
    display:grid; grid-template-columns:38% 1fr; gap:14px; align-items:stretch;
    text-decoration:none; color:inherit; position:relative; padding:12px;
    background:linear-gradient(180deg,#352b24,#241c18); border:1px solid rgba(224,168,60,.5);
    box-shadow:0 18px 40px rgba(0,0,0,.45); transition:transform .15s ease, border-color .15s ease;
  }
  a.game::before{content:""; position:absolute; inset:5px; border:1px solid rgba(224,168,60,.15); pointer-events:none}
  a.game:hover{transform:translateY(-3px); border-color:var(--gold)}
  a.game:active{transform:translateY(1px)}
  a.game:focus-visible{outline:2px solid var(--stone); outline-offset:3px}
  @media (min-width:700px){ a.game{grid-template-columns:1fr; padding:14px} }
  .shot{display:block; width:100%; height:100%; min-height:150px; object-fit:cover; object-position:50% 30%;
        border-radius:10px; border:2px solid #16110e; background:#16110e}
  @media (min-width:700px){ .shot{height:auto; aspect-ratio:4/3.4; min-height:0} }
  .body{display:flex; flex-direction:column; gap:6px; min-width:0; padding:2px 2px 0}
  .tag{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase}
  .g1 .tag{color:var(--blue)} .g2 .tag{color:var(--gold)} .g3 .tag{color:#7fe38f} .g4 .tag{color:#8fd8ff}
  h2{font-family:var(--disp); font-weight:400; font-size:clamp(22px,6vw,30px); line-height:1.05; margin:0; color:#fff3da}
  .desc{margin:0; font-size:14px; line-height:1.55; color:var(--soft)}
  .rec{font-size:12px; color:rgba(228,219,198,.6); margin:0}
  .rec b{font-family:var(--disp); font-weight:400; color:var(--gold); margin-left:3px; white-space:nowrap}
  .rec:empty{display:none}
  .play{margin-top:auto; align-self:flex-start; font-family:var(--disp); font-size:17px; color:var(--ink);
        background:var(--gold); padding:9px 18px 8px; border-bottom:4px solid #a37520}
  footer{text-align:center; margin-top:22px; font-size:13px}
  footer a{color:rgba(228,219,198,.62); text-underline-offset:3px}
  footer a:hover{color:var(--stone)}
  @media (prefers-reduced-motion:reduce){ a.game{transition:none} a.game:hover{transform:none} }
</style>
</head>
<body>
<main>
  <div class="eyebrow">AI Game Lab</div>
  <h1>ゲームを選ぶ</h1>
  <div class="list">
    <a class="game g1" href="geigeki_road.html">
      <img class="shot" src="assets/screens/geigeki_1.jpg" width="540" height="1052" alt="迎撃ロードのプレイ画面。道の門と兵が増える板が流れてくる">
      <div class="body">
        <span class="tag">撃って守る</span>
        <h2>迎撃ロード</h2>
        <p class="desc">流れてくる門を撃ち開けて仲間を増やし、押し寄せる大軍と巨人を食い止めろ。</p>
        <p class="rec" id="recG"></p>
        <span class="play">▶ 遊ぶ</span>
      </div>
    </a>
    <a class="game g2" href="million_march.html">
      <img class="shot" src="assets/screens/million_1.jpg" width="540" height="1052" alt="Million March のプレイ画面。ゲートの先で巨人が待っている">
      <div class="body">
        <span class="tag">率いて進む</span>
        <h2>Million March</h2>
        <p class="desc">ゲートをくぐるたびに兵が増える。軍勢を100万へ育てて、巨人を倒せ。</p>
        <p class="rec" id="recM"></p>
        <span class="play">▶ 遊ぶ</span>
      </div>
    </a>
    <a class="game g3" href="../power-tower/">
      <img class="shot" src="assets/screens/power_2.jpg" width="540" height="1052" alt="パワータワーのプレイ画面。塔の部屋に敵やアイテムが並ぶ">
      <div class="body">
        <span class="tag">吸収して登る</span>
        <h2>パワータワー</h2>
        <p class="desc">弱い敵を吸収してパワーアップ。塔を登ってボスを倒し、お姫様を助け出せ。</p>
        <span class="play">▶ 遊ぶ</span>
      </div>
    </a>
    <a class="game g4" href="../snow-grill/">
      <img class="shot" src="assets/screens/snow_2.jpg" width="540" height="1052" alt="スノーグリルのプレイ画面。グリルで肉を焼き、凍えた村人が列に並ぶ">
      <div class="body">
        <span class="tag">狩って焼いて配る</span>
        <h2>スノーグリル</h2>
        <p class="desc">白クマを倒して肉を焼き、凍えた村人に配ろう。キャンプを広げて、雪の巨人に挑め。</p>
        <span class="play">▶ 遊ぶ</span>
      </div>
    </a>
  </div>
  <footer><a href="index.html">AIゲーム実験室のトップへ</a></footer>
</main>
<script>
/* 遊んだことがあれば、各ゲームの最高記録を添える（端末に保存された値を読むだけ） */
(() => {
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const num = (v) => { const n = parseInt(v || "0", 10); return isFinite(n) ? n : 0; };
  const short = (n) => n >= 1e8 ? (n / 1e8).toFixed(1).replace(/\.0$/, "") + "億"
                    : n >= 1e4 ? Math.floor(n / 1e4).toLocaleString("ja-JP") + "万" : n.toLocaleString("ja-JP");
  const gBest = num(get("gr.best"));
  if (gBest > 0) document.getElementById("recG").innerHTML = "最高兵力<b>" + short(gBest) + "</b>";
  const mBest = num(get("zg.best")), mStage = num(get("mm.bestStage"));
  if (mBest > 0 || mStage > 0) document.getElementById("recM").innerHTML =
    (mBest > 0 ? "最高兵力<b>" + short(mBest) + "</b>　" : "") + (mStage > 0 ? "最高到達<b>Stage " + mStage + "</b>" : "");
})();
</script>
</body>
</html>
