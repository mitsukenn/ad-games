<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>感想・改善案を送る｜AIゲーム実験室</title>
<meta name="description" content="AIゲーム実験室のゲームへの感想・改善案・不具合の報告はこちらから。">
<meta name="theme-color" content="#241c18">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chango&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --ink:#241c18; --stone:#e4dbc6; --soft:rgba(228,219,198,.72);
    --gold:#e0a83c;
    --disp:"Chango","Arial Black",system-ui,sans-serif;
    --ui:"Barlow Semi Condensed","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; min-height:100dvh; font-family:var(--ui); color:var(--stone);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(36,28,24,.45), rgba(20,15,12,.92) 70%),
      url("assets/ancient-valley.webp") center/cover no-repeat fixed, var(--ink);
  }
  main{width:100%; max-width:560px; margin:0 auto;
       padding:max(28px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom))}
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); text-align:center}
  h1{font-family:var(--disp); font-weight:400; color:var(--gold); text-align:center; line-height:1.15;
     font-size:clamp(24px,7vw,36px); margin:8px 0 10px; text-shadow:0 3px 0 rgba(0,0,0,.45)}
  .lede{margin:0 0 20px; text-align:center; font-size:14px; line-height:1.6; color:var(--soft)}
  form, .done{
    position:relative; padding:20px 18px 18px;
    background:linear-gradient(180deg,#352b24,#241c18); border:1px solid rgba(224,168,60,.5);
    box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  form::before, .done::before{content:""; position:absolute; inset:5px; border:1px solid rgba(224,168,60,.15); pointer-events:none}
  fieldset{border:0; margin:0 0 18px; padding:0; min-width:0}
  legend, label.k{display:block; font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--gold); margin:0 0 8px; padding:0}
  legend small, label.k small{font-weight:600; color:rgba(228,219,198,.5); letter-spacing:0; margin-left:6px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chips label{position:relative}
  .chips input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
  .chips span{
    display:inline-block; padding:8px 12px 7px; font-size:15px; font-weight:700; line-height:1.2;
    border:1px solid rgba(224,168,60,.4); color:rgba(228,219,198,.8); background:rgba(20,15,12,.45);
  }
  .chips input:checked + span{background:var(--gold); color:var(--ink); border-color:var(--gold)}
  .chips input:focus-visible + span{outline:2px solid var(--stone); outline-offset:2px}
  .stars{display:flex; gap:4px}
  .stars button{
    font-size:30px; line-height:1; padding:2px 4px; background:none; border:0; cursor:pointer;
    color:rgba(228,219,198,.25); touch-action:manipulation;
  }
  .stars button.on{color:#ffd76a}
  .stars button:focus-visible{outline:2px solid var(--stone); outline-offset:1px}
  textarea, input[type=text]{
    width:100%; font:600 16px/1.6 var(--ui); color:var(--stone);
    background:rgba(20,15,12,.7); border:1px solid rgba(224,168,60,.45); border-radius:2px; padding:10px 12px;
  }
  textarea{min-height:150px; resize:vertical}
  textarea:focus, input[type=text]:focus{outline:2px solid var(--gold); outline-offset:1px}
  .count{text-align:right; font-size:12px; color:rgba(228,219,198,.5); margin-top:4px}
  .btn{
    display:inline-block; font-family:var(--disp); font-size:18px; color:var(--ink); text-decoration:none;
    background:var(--gold); border:0; border-bottom:4px solid #a37520; padding:12px 28px 11px; cursor:pointer;
  }
  .btn:disabled{opacity:.6; cursor:default}
  .btn:focus-visible{outline:2px solid var(--stone); outline-offset:3px}
  .send{text-align:center}
  .msg{margin:12px 0 0; min-height:1.4em; text-align:center; font-size:14px; color:#ffb4a8}
  .done{text-align:center}
  .done h2{font-family:var(--disp); font-weight:400; color:var(--gold); font-size:26px; margin:6px 0 10px}
  .done p{margin:0 0 18px; line-height:1.6; color:var(--soft)}
  .done .again{display:block; margin:14px auto 0; background:none; border:0; color:rgba(228,219,198,.62);
               font:600 14px var(--ui); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
  footer{text-align:center; margin-top:22px; font-size:13px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap}
  footer a{color:rgba(228,219,198,.62); text-underline-offset:3px}
  footer a:hover{color:var(--stone)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Feedback</div>
  <h1>感想・改善案を送る</h1>
  <p class="lede">「ここが楽しい」「ここが難しすぎる」「こうしてほしい」など、ひとことでも大歓迎です。<br>いただいた声をもとに、AIがゲームを直していきます。</p>

  <form id="form" novalidate>
    <fieldset>
      <legend>どのゲーム？</legend>
      <div class="chips" id="games"></div>
    </fieldset>
    <fieldset>
      <legend>どんな内容？</legend>
      <div class="chips">
        <label><input type="radio" name="kind" value="感想" checked><span>😊 感想</span></label>
        <label><input type="radio" name="kind" value="改善案"><span>💡 改善案</span></label>
        <label><input type="radio" name="kind" value="不具合"><span>🐞 不具合</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>おもしろさ<small>任意</small></legend>
      <div class="stars" id="stars" role="radiogroup" aria-label="おもしろさ（5段階）"></div>
    </fieldset>
    <fieldset>
      <label class="k" for="text">内容</label>
      <textarea id="text" maxlength="600" placeholder="例：3面の巨人が強すぎて進めない。武器がもう少し早く強くなるとうれしい"></textarea>
      <div class="count"><span id="count">0</span> / 600</div>
    </fieldset>
    <fieldset>
      <label class="k" for="name">なまえ<small>任意・12文字まで</small></label>
      <input type="text" id="name" maxlength="12" autocomplete="nickname" enterkeyhint="done">
    </fieldset>
    <div class="send"><button class="btn" id="btnSend" type="submit">送る</button></div>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <div class="done" id="done" hidden>
    <div class="eyebrow">Thank you</div>
    <h2>届きました！</h2>
    <p>ありがとうございます。<br>次のアップデートの参考にします。</p>
    <a class="btn" id="btnBack" href="select.html">ゲームにもどる</a>
    <button class="again" id="btnAgain" type="button">もう1通送る</button>
  </div>

  <footer>
    <a id="backLink" href="select.html">ゲームにもどる</a>
    <a href="index.html">AIゲーム実験室のトップ</a>
  </footer>
</main>
<script>
(() => {
  "use strict";
  // 迎撃ロードのランキングと同じ Google Apps Script に送る（シート feedback に1件ずつ並ぶ）
  const API = "https://script.google.com/macros/s/AKfycbyNh85RNVYJM1_cn5vn6d4_lFm-3_9MeQZe1vMGU4xk-fHRvGbbGUIgkgI2QUXhYyySMw/exec";
  // ?game= で最初から選んでおく。url は「ゲームにもどる」の行き先
  const GAMES = [
    { id: "geigeki", name: "迎撃ロード", url: "geigeki_road.html" },
    { id: "million", name: "Million March", url: "million_march.html" },
    { id: "power", name: "パワータワー", url: "../power-tower/" },
    { id: "snow", name: "スノーグリル", url: "../snow-grill/" },
    { id: "tetris", name: "テトリスパズル", url: "../tetris-puzzle/" },
    { id: "lab", name: "実験室全体", url: "./" },
  ];
  const $ = (id) => document.getElementById(id);
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const want = new URLSearchParams(location.search).get("game");
  const first = GAMES.find((g) => g.id === want) || GAMES[0];
  $("games").innerHTML = GAMES.map((g) =>
    `<label><input type="radio" name="game" value="${g.id}"${g === first ? " checked" : ""}><span>${g.name}</span></label>`).join("");
  const setBack = () => {
    const g = GAMES.find((x) => x.id === gameNow()) || first;
    $("backLink").href = $("btnBack").href = g.url;
  };
  const gameNow = () => (document.querySelector("input[name=game]:checked") || {}).value || first.id;
  $("games").addEventListener("change", setBack);
  setBack();

  // 星（もう一度同じ星を押すと取り消し）
  let stars = 0;
  $("stars").innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="false" aria-label="${n}">★</button>`).join("");
  const starBtns = [...$("stars").children];
  const paintStars = () => starBtns.forEach((b, i) => { b.classList.toggle("on", i < stars); b.setAttribute("aria-checked", String(i + 1 === stars)); });
  starBtns.forEach((b, i) => b.addEventListener("click", () => { stars = stars === i + 1 ? 0 : i + 1; paintStars(); }));

  const text = $("text"), name = $("name"), msg = $("msg"), btn = $("btnSend");
  name.value = lsGet("fb.name", lsGet("gr.name", ""));
  text.addEventListener("input", () => { $("count").textContent = text.value.length; });

  // 端末のおおまかな種類だけ添える（不具合を直すときの手がかり）
  function device() {
    const u = navigator.userAgent;
    const os = /iPhone|iPod/.test(u) ? "iPhone" : /iPad/.test(u) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? "iPad"
      : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows" : /Mac/.test(u) ? "Mac" : "その他";
    const app = /Line\//.test(u) ? " LINE内" : /Instagram|FBAN|FBAV/.test(u) ? " SNSアプリ内" : "";
    return os + app + " " + innerWidth + "x" + innerHeight;
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = text.value.trim();
    if (body.length < 2) { msg.textContent = "内容を書いてください"; text.focus(); return; }
    const last = Number(lsGet("fb.last", "0"));
    if (Date.now() - last < 20000) { msg.textContent = "少し時間をおいてから送ってください"; return; }
    btn.disabled = true; btn.textContent = "送っています…"; msg.textContent = "";
    try {
      const res = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "feedback", game: gameNow(), kind: (document.querySelector("input[name=kind]:checked") || {}).value,
                               stars, text: body, name: name.value.trim(), device: device() }) });
      const r = await res.json();
      if (!r.ok) throw new Error(r.error || "failed");
      lsSet("fb.last", String(Date.now())); lsSet("fb.name", name.value.trim());
      $("form").hidden = true; $("done").hidden = false;
      scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) {
      msg.textContent = "うまく送れませんでした。電波のよいところで、もう一度お試しください。";
    } finally {
      btn.disabled = false; btn.textContent = "送る";
    }
  });
  $("btnAgain").addEventListener("click", () => {
    text.value = ""; $("count").textContent = "0"; stars = 0; paintStars();
    $("done").hidden = true; $("form").hidden = false;
  });
})();
</script>
</body>
</html>
