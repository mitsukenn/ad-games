<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>感想を送る｜AIゲーム実験室</title>
<meta name="description" content="AIゲーム実験室のゲームへの感想はこちらから。ひとことでも、星だけでもOK。">
<meta name="theme-color" content="#1c1845">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  /* トップページ（index.html）と同じ、夜空の紫に白いカードの明るい見た目 */
  :root{
    --night:#1c1845; --night2:#2a2266; --ink:#1a1530; --soft:rgba(255,255,255,.8);
    --gold:#ffc53d; --gold-d:#d98f00; --purple:#6b4bd8; --line:#e6e2f5;
    --geigeki:#4d8dff; --million:#ff9a2e; --power:#2fbf68; --snow:#27b4ee; --tetris:#ff5fa4; --lab:#8a6cf0;
    --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{position:relative; margin:0; min-height:100vh; font-family:var(--round); color:#fff; line-height:1.6; overflow-x:hidden;
       background:
         radial-gradient(circle at 15% 8%, rgba(255,197,61,.22), transparent 32%),
         radial-gradient(circle at 90% 40%, rgba(255,95,164,.18), transparent 30%),
         linear-gradient(180deg, var(--night) 0, var(--night2) 100%) var(--night)}
  .sky{position:absolute; inset:0 0 auto 0; height:380px; z-index:-1; opacity:.75;
       background:url("assets/ancient-valley.webp") center top/cover no-repeat;
       -webkit-mask-image:linear-gradient(#000 35%, transparent); mask-image:linear-gradient(#000 35%, transparent)}
  main{max-width:560px; margin:0 auto; padding:max(20px, env(safe-area-inset-top)) 16px 32px}

  .head{text-align:center; padding:6px 0 16px}
  .head img{width:84px; height:84px; margin:0 auto -4px; display:block; filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
  h1{margin:0 0 6px; font-size:clamp(26px,7.4vw,34px); font-weight:800; line-height:1.2;
     text-shadow:0 3px 0 var(--purple), 0 6px 0 #3b2a8f, 0 10px 18px rgba(0,0,0,.4)}
  .lede{margin:0; font-size:14px; font-weight:800; color:var(--soft); text-shadow:0 2px 6px rgba(0,0,0,.4)}

  /* 白いカード */
  .card{background:#fff; color:var(--ink); border-radius:24px; padding:18px 16px 20px; box-shadow:0 8px 0 rgba(0,0,0,.18), 0 18px 34px rgba(0,0,0,.3)}
  .card[hidden]{display:none}
  fieldset{border:0; margin:0 0 18px; padding:0; min-width:0}
  legend,.k{display:block; padding:0; margin:0 0 8px; font-size:14px; font-weight:800; color:var(--ink)}
  legend small,.k small{margin-left:6px; font-size:11px; font-weight:500; color:#8a86a0}

  /* ゲームを選ぶ（ゲームごとの色） */
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chips label{position:relative}
  .chips input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
  .chips span{display:block; padding:6px 13px; border-radius:999px; font-size:13px; font-weight:800; color:#5b5773; background:#f2f0fa;
              border:2px solid transparent; transition:transform .1s}
  .chips input:checked + span{color:#fff; background:var(--c); box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .chips input:focus-visible + span{border-color:var(--ink)}
  .chips label:active span{transform:scale(.95)}

  /* 星 */
  .stars{display:flex; gap:4px}
  .stars button{width:48px; height:48px; padding:0; border:0; background:none; font-size:40px; line-height:1; color:#e2dff0; cursor:pointer;
                transition:transform .12s ease, color .12s}
  .stars button.on{color:var(--gold); text-shadow:0 3px 0 var(--gold-d)}
  .stars button:active{transform:scale(.88)}
  .stars button:focus-visible{outline:3px solid var(--purple); border-radius:10px}

  textarea{display:block; width:100%; min-height:132px; resize:vertical; padding:12px 14px; border:2px solid var(--line); border-radius:16px;
           font:500 16px/1.6 var(--round); color:var(--ink); background:#faf9ff}
  textarea:focus{outline:none; border-color:var(--purple); background:#fff}
  textarea::placeholder{color:#a9a5bd}
  .count{margin-top:4px; text-align:right; font-size:11px; color:#a9a5bd}

  .btn{display:flex; align-items:center; justify-content:center; width:100%; min-height:54px; border:0; border-radius:999px; cursor:pointer;
       font:800 18px var(--round); color:var(--ink); background:var(--gold); box-shadow:0 5px 0 var(--gold-d); text-decoration:none}
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--gold-d)}
  .btn:disabled{opacity:.6}
  .btn:focus-visible{outline:3px solid var(--purple); outline-offset:3px}
  .msg{min-height:1.4em; margin:10px 0 0; text-align:center; font-size:13px; font-weight:800; color:#d0355d}
  .note{margin:10px 0 0; text-align:center; font-size:11px; color:#8a86a0}

  /* 送れたあと */
  .done{text-align:center; padding:26px 18px 22px}
  .done img{width:96px; height:96px; display:block; margin:0 auto 4px; animation:hop .6s ease both}
  @keyframes hop{0%{transform:scale(.4) translateY(20px); opacity:0} 70%{transform:scale(1.08)}}
  .done h2{margin:0 0 6px; font-size:24px; font-weight:800; color:var(--purple)}
  .done p{margin:0 0 18px; font-size:14px; color:#5b5773}
  .again{margin-top:12px; border:0; background:none; font:800 14px var(--round); color:var(--purple); text-decoration:underline; text-underline-offset:3px; cursor:pointer}

  footer{display:flex; justify-content:center; flex-wrap:wrap; gap:6px 20px; margin-top:22px; font-size:13px; font-weight:800}
  footer a{color:var(--soft); text-underline-offset:3px}
  footer a:hover{color:#fff}
  @media (max-width:340px){ .stars button{width:42px; height:42px; font-size:34px} .chips span{padding:5px 10px; font-size:12px} }
  @media (prefers-reduced-motion:reduce){ .done img{animation:none} .stars button,.chips span{transition:none} }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <div class="head">
    <img src="assets/ui/icon_letter.webp?v=3" alt="" width="96" height="96">
    <h1>感想を送る</h1>
    <p class="lede">ひとことでも、星だけでもOK。<br>もらった声で、AIがゲームを直していきます。</p>
  </div>

  <form class="card" id="form" novalidate>
    <fieldset>
      <legend>どのゲーム？</legend>
      <div class="chips" id="games"></div>
    </fieldset>
    <fieldset>
      <legend>おもしろさ<small>タップするだけ</small></legend>
      <div class="stars" id="stars" role="radiogroup" aria-label="おもしろさ（5段階）"></div>
    </fieldset>
    <fieldset>
      <label class="k" for="text">ひとこと<small>なんでも自由に</small></label>
      <textarea id="text" maxlength="600" placeholder="楽しかったところ、むずかしかったところ、こうしてほしいこと、動きがおかしかったところ…なんでも"></textarea>
      <div class="count"><span id="count">0</span> / 600</div>
    </fieldset>
    <button class="btn" id="btnSend" type="submit">送る</button>
    <p class="msg" id="msg" role="status"></p>
    <p class="note">名前やメールアドレスは要りません</p>
  </form>

  <div class="card done" id="done" hidden>
    <img src="assets/ui/icon_robot.webp?v=3" alt="" width="96" height="96">
    <h2>届きました！</h2>
    <p>ありがとうございます。<br>次のアップデートで直していきます。</p>
    <a class="btn" id="btnBack" href="./">ゲームにもどる</a>
    <button class="again" id="btnAgain" type="button">もう1通送る</button>
  </div>

  <footer>
    <a id="backLink" href="./">ゲームにもどる</a>
    <a href="./">AIゲーム実験室のトップ</a>
  </footer>
</main>
<script>
(() => {
  "use strict";
  // 迎撃ロードのランキングと同じ Google Apps Script に送る（シート feedback に1件ずつ並ぶ）
  const API = "https://script.google.com/macros/s/AKfycbyNh85RNVYJM1_cn5vn6d4_lFm-3_9MeQZe1vMGU4xk-fHRvGbbGUIgkgI2QUXhYyySMw/exec";
  // ?game= で最初から選んでおく。url は「ゲームにもどる」の行き先
  // 感想・改善案・不具合の区別は書く人に選ばせない（手間を減らす）。中身はこちらで読み取る
  const GAMES = [
    { id: "geigeki", name: "迎撃ロード", url: "geigeki_road.html" },
    { id: "million", name: "Million March", url: "million_march.html" },
    { id: "power", name: "パワータワー", url: "../power-tower/" },
    { id: "snow", name: "スノーグリル", url: "../snow-grill/" },
    { id: "tetris", name: "テトリスパズル", url: "../tetris-puzzle/" },
    { id: "lab", name: "実験室全体", url: "./" },
  ];
  const $ = (id) => document.getElementById(id);
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const want = new URLSearchParams(location.search).get("game");
  const first = GAMES.find((g) => g.id === want) || GAMES[0];
  $("games").innerHTML = GAMES.map((g) =>
    `<label style="--c:var(--${g.id})"><input type="radio" name="game" value="${g.id}"${g === first ? " checked" : ""}><span>${g.name}</span></label>`).join("");
  const setBack = () => {
    const g = GAMES.find((x) => x.id === gameNow()) || first;
    $("backLink").href = $("btnBack").href = g.url;
  };
  const gameNow = () => (document.querySelector("input[name=game]:checked") || {}).value || first.id;
  $("games").addEventListener("change", setBack);
  setBack();

  // 星（もう一度同じ星を押すと取り消し）
  let stars = 0;
  $("stars").innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="false" aria-label="${n}">★</button>`).join("");
  const starBtns = [...$("stars").children];
  const paintStars = () => starBtns.forEach((b, i) => { b.classList.toggle("on", i < stars); b.setAttribute("aria-checked", String(i + 1 === stars)); });
  starBtns.forEach((b, i) => b.addEventListener("click", () => { stars = stars === i + 1 ? 0 : i + 1; paintStars(); }));

  const text = $("text"), msg = $("msg"), btn = $("btnSend");
  text.addEventListener("input", () => { $("count").textContent = text.value.length; });

  // 端末のおおまかな種類だけ添える（不具合を直すときの手がかり）
  function device() {
    const u = navigator.userAgent;
    const os = /iPhone|iPod/.test(u) ? "iPhone" : /iPad/.test(u) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? "iPad"
      : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows" : /Mac/.test(u) ? "Mac" : "その他";
    const app = /Line\//.test(u) ? " LINE内" : /Instagram|FBAN|FBAV/.test(u) ? " SNSアプリ内" : "";
    return os + app + " " + innerWidth + "x" + innerHeight;
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    // 星だけでも送れる（サーバーは2文字以上の本文が要るので、そのときは「（星だけ）」と書いて送る）
    const body = text.value.trim() || (stars ? "（星だけ）" : "");
    if (body.length < 2) { msg.textContent = "星をタップするか、ひとこと書いてください"; return; }
    const last = Number(lsGet("fb.last", "0"));
    if (Date.now() - last < 20000) { msg.textContent = "少し時間をおいてから送ってください"; return; }
    btn.disabled = true; btn.textContent = "送っています…"; msg.textContent = "";
    try {
      const res = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "feedback", game: gameNow(), stars, text: body, device: device() }) });
      const r = await res.json();
      if (!r.ok) throw new Error(r.error || "failed");
      lsSet("fb.last", String(Date.now()));
      $("form").hidden = true; $("done").hidden = false;
      scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) {
      msg.textContent = "うまく送れませんでした。電波のよいところで、もう一度お試しください。";
    } finally {
      btn.disabled = false; btn.textContent = "送る";
    }
  });
  $("btnAgain").addEventListener("click", () => {
    text.value = ""; $("count").textContent = "0"; stars = 0; paintStars(); msg.textContent = "";
    $("done").hidden = true; $("form").hidden = false;
  });
})();
</script>
</body>
</html>
